<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Times - Atualização Automática</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe
    id="planilhaTimes"
    title="Aba Times"
    loading="eager"
  ></iframe>

  <script>
    const PLANILHA_ID = "1m0zpU8j4v6vYIYLUz_-Z84uO4TMYtvC9DbJmo9VbZc0";
    const GID_TIMES = "2004879334";

    function atualizarTela() {
      const agora = Date.now();

      const linkAtualizado =
        `https://docs.google.com/spreadsheets/d/${PLANILHA_ID}/preview?pli=1&gid=${GID_TIMES}&atualizacao=${agora}#gid=${GID_TIMES}`;

      document.getElementById("planilhaTimes").src = linkAtualizado;
    }

    atualizarTela();

    // Recarrega a visualização da TV de 1 em 1 minuto
    setInterval(atualizarTela, 60000);
  </script>

</body>
</html>
