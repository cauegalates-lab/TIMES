<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Times - Atualização Automática</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

  <iframe id="planilhaTimes"></iframe>

  <script>
    function atualizarTela() {
      const agora = new Date().getTime();

      const linkAtualizado =
        "https://docs.google.com/spreadsheets/d/1m0zpU8j4v6vYIYLUz_-Z84uO4TMYtvC9DbJmo9VbZc0/preview?gid=2004879334&atualizacao=" +
        agora +
        "#gid=2004879334";

      document.getElementById("planilhaTimes").src = linkAtualizado;
    }

    atualizarTela();

    // Recarrega a visualização da TV de 1 em 1 minuto
    setInterval(atualizarTela, 60000);
  </script>

</body>
</html>
